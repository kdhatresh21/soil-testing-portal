{% extends "base.html" %}{% block title %}Log in · SoilCare Portal{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <span class="eyebrow">WELCOME BACK</span><h1 class="h2 fw-bold mt-2">Log in to your account</h1>
  <p class="text-muted">Access appointments and soil test reports.</p>
  <form method="post">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
  <label class="form-label" for="email">Email or mobile number</label>
  <input class="form-control form-control-lg"
         id="email"
         name="email"
         type="text"
         required
         autocomplete="username"
         placeholder="Enter email or mobile number">
</div>
    <div class="mb-3">
  <label class="form-label" for="password">Password</label>
  <div class="input-group">
    <input class="form-control form-control-lg"
           id="password"
           name="password"
           type="password"
           required
           autocomplete="current-password">

    <button class="btn btn-outline-secondary"
            type="button"
            onclick="togglePassword('password', this)"
            aria-label="Show password">
      <i class="bi bi-eye"></i>
    </button>
  </div>
</div>

<script>
function togglePassword(inputId, button) {
    const password = document.getElementById(inputId);
    const icon = button.querySelector("i");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
        button.setAttribute("aria-label", "Hide password");
    } else {
        password.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
        button.setAttribute("aria-label", "Show password");
    }
}
</script>
    <button class="btn btn-success btn-lg w-100" type="submit">Log in</button>
  </form>
  <p class="small text-muted mt-4 mb-0">New farmer? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</div></div>
{% endblock %}
